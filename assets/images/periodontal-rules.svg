<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<defs>
<style>
  .t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}
  .h{font-size:28px;font-weight:700;fill:#141918}
  .s{font-size:16px;fill:#6b756f}
  .m{font-size:21px;font-weight:700;fill:#141918}
  .b{font-size:15px;fill:#4f5953}
  .line{stroke:#829087;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow{fill:#829087}
</style>
</defs>
<rect width="1200" height="760" rx="28" fill="#fbfcfa"/>
<rect x="60" y="60" width="1080" height="88" rx="24" fill="#dfeaff"/>
<text x="110" y="98" class="t h">牙周规则诊断模型</text>
<text x="110" y="128" class="t s">从 0 → 1 参与规则梳理：与业务方共同制定规则，我负责系统建模与实现</text>

<rect x="70" y="200" width="210" height="150" rx="24" fill="#f3e6d2"/>
<text x="175" y="245" text-anchor="middle" class="t m">检查数据采集</text>
<text x="175" y="285" text-anchor="middle" class="t b">牙位 / 点位录入</text>
<text x="175" y="315" text-anchor="middle" class="t b">基础检查指标</text>

<rect x="340" y="175" width="240" height="200" rx="24" fill="#e7f0e3"/>
<text x="460" y="220" text-anchor="middle" class="t m">数据建模</text>
<text x="460" y="260" text-anchor="middle" class="t b">点位指标：PD / CAL / BOP</text>
<text x="460" y="290" text-anchor="middle" class="t b">点位指标：PI / GR / SUP / GM</text>
<text x="460" y="320" text-anchor="middle" class="t b">整牙指标：FUR / MOB</text>
<text x="460" y="350" text-anchor="middle" class="t b">统一成结构化检查数据</text>

<rect x="640" y="160" width="260" height="230" rx="24" fill="#eee5f7"/>
<text x="770" y="205" text-anchor="middle" class="t m">规则判断与统计</text>
<text x="770" y="245" text-anchor="middle" class="t b">炎症统计</text>
<text x="770" y="275" text-anchor="middle" class="t b">受累牙判断</text>
<text x="770" y="305" text-anchor="middle" class="t b">点位 / 整牙结果汇总</text>
<text x="770" y="335" text-anchor="middle" class="t b">检查结果分层</text>
<text x="770" y="365" text-anchor="middle" class="t b">生成辅助提示</text>

<rect x="960" y="200" width="170" height="150" rx="24" fill="#dff07d"/>
<text x="1045" y="245" text-anchor="middle" class="t m">统计结果</text>
<text x="1045" y="285" text-anchor="middle" class="t b">异常项提示</text>
<text x="1045" y="315" text-anchor="middle" class="t b">诊疗建议展示</text>

<path class="line" d="M280 275H330"/><polygon class="arrow" points="323,268 323,282 336,275"/>
<path class="line" d="M580 275H630"/><polygon class="arrow" points="623,268 623,282 636,275"/>
<path class="line" d="M900 275H950"/><polygon class="arrow" points="943,268 943,282 956,275"/>

<path class="line" d="M1045 350V430"/><polygon class="arrow" points="1038,423 1052,423 1045,436"/>
<rect x="395" y="450" width="650" height="110" rx="24" fill="#fff" stroke="#dde3dd" stroke-width="2"/>
<text x="720" y="492" text-anchor="middle" class="t m">医生查看、修改与确认</text>
<text x="720" y="528" text-anchor="middle" class="t b">系统以统计结果 + 辅助提示为主，最终以医生修改 / 确认为准</text>

<path class="line" d="M720 560V620"/><polygon class="arrow" points="713,613 727,613 720,626"/>
<rect x="445" y="635" width="550" height="70" rx="24" fill="#173f37"/>
<text x="720" y="675" text-anchor="middle" class="t m" fill="#fff">保存：检查结果 + 诊疗建议 + 医生最终确认</text>
</svg>