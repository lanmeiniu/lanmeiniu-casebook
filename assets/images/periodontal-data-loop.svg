<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
<defs>
<style>
.t{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif}
.h{font-size:28px;font-weight:700;fill:#141918}
.s{font-size:16px;fill:#6b756f}
.m{font-size:20px;font-weight:700;fill:#141918}
.b{font-size:15px;fill:#4f5953}
.xs{font-size:14px;fill:#68736d}
.line{stroke:#829087;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.vline{stroke:#9aa79f;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
.arrow{fill:#829087}
</style>
</defs>
<rect width="1200" height="860" rx="28" fill="#fbfcfa"/>
<rect x="60" y="50" width="1080" height="90" rx="24" fill="#dfeaff"/>
<text x="110" y="90" class="t h">数据模型与业务闭环</text>
<text x="110" y="120" class="t s">聚焦 0→1 业务建模：把牙周检查、图片、规则、报表与 AI 串成完整闭环</text>

<!-- main chain -->
<rect x="70" y="190" width="150" height="82" rx="22" fill="#f3e6d2"/>
<text x="145" y="224" text-anchor="middle" class="t m">患者</text>
<text x="145" y="250" text-anchor="middle" class="t xs">档案信息</text>

<rect x="280" y="190" width="170" height="82" rx="22" fill="#e7f0e3"/>
<text x="365" y="224" text-anchor="middle" class="t m">就诊记录</text>
<text x="365" y="250" text-anchor="middle" class="t xs">就诊上下文</text>

<rect x="510" y="190" width="185" height="82" rx="22" fill="#dff07d"/>
<text x="602" y="224" text-anchor="middle" class="t m">牙周检查</text>
<text x="602" y="250" text-anchor="middle" class="t xs">一次检查的主对象</text>

<rect x="755" y="190" width="160" height="82" rx="22" fill="#eee5f7"/>
<text x="835" y="224" text-anchor="middle" class="t m">牙齿</text>
<text x="835" y="250" text-anchor="middle" class="t xs">按牙位组织</text>

<rect x="975" y="190" width="150" height="82" rx="22" fill="#f6dfdf"/>
<text x="1050" y="224" text-anchor="middle" class="t m">检查点位</text>
<text x="1050" y="250" text-anchor="middle" class="t xs">点位级采集</text>

<path class="line" d="M220 231H270"/><polygon class="arrow" points="263,224 263,238 276,231"/>
<path class="line" d="M450 231H500"/><polygon class="arrow" points="493,224 493,238 506,231"/>
<path class="line" d="M695 231H745"/><polygon class="arrow" points="738,224 738,238 751,231"/>
<path class="line" d="M915 231H965"/><polygon class="arrow" points="958,224 958,238 971,231"/>

<!-- image import side module -->
<rect x="890" y="330" width="250" height="210" rx="24" fill="#eef7ea" stroke="#dde3dd" stroke-width="2"/>
<text x="1015" y="370" text-anchor="middle" class="t m">图片导入与关联</text>
<text x="1015" y="405" text-anchor="middle" class="t b">文件夹：患者编码 + 姓名</text>
<text x="1015" y="433" text-anchor="middle" class="t b">或：二维码分组识别</text>
<text x="1015" y="461" text-anchor="middle" class="t b">匹配患者 / 就诊 / 检查</text>
<text x="1015" y="489" text-anchor="middle" class="t b">形成图片归档记录</text>
<text x="1015" y="517" text-anchor="middle" class="t xs">支持后续回溯与展示</text>
<path class="vline" d="M915 330V300H835V278"/><polygon class="arrow" points="828,285 842,285 835,272"/>

<!-- indicators -->
<rect x="90" y="360" width="340" height="175" rx="26" fill="#ffffff" stroke="#dde3dd" stroke-width="2"/>
<text x="260" y="402" text-anchor="middle" class="t m">点位级指标</text>
<text x="260" y="438" text-anchor="middle" class="t b">PD / CAL / BOP</text>
<text x="260" y="468" text-anchor="middle" class="t b">PI / GR / SUP / GM</text>
<text x="260" y="500" text-anchor="middle" class="t xs">适合表达精细检查数据</text>

<rect x="480" y="360" width="340" height="175" rx="26" fill="#ffffff" stroke="#dde3dd" stroke-width="2"/>
<text x="650" y="402" text-anchor="middle" class="t m">整牙级指标</text>
<text x="650" y="438" text-anchor="middle" class="t b">FUR / MOB</text>
<text x="650" y="468" text-anchor="middle" class="t b">牙齿维度结果汇总</text>
<text x="650" y="500" text-anchor="middle" class="t xs">适合表达整牙状态</text>

<path class="line" d="M602 272V320H260V350"/><polygon class="arrow" points="253,343 267,343 260,356"/>
<path class="line" d="M835 272V320H650V350"/><polygon class="arrow" points="643,343 657,343 650,356"/>

<!-- bottom chain -->
<rect x="230" y="610" width="300" height="135" rx="24" fill="#dfeaff"/>
<text x="380" y="652" text-anchor="middle" class="t m">规则统计与诊疗建议</text>
<text x="380" y="687" text-anchor="middle" class="t b">炎症统计 / 受累牙判断</text>
<text x="380" y="715" text-anchor="middle" class="t b">生成统计结果 + 辅助提示</text>

<rect x="590" y="610" width="300" height="135" rx="24" fill="#f3e6d2"/>
<text x="740" y="652" text-anchor="middle" class="t m">医生查看与确认</text>
<text x="740" y="687" text-anchor="middle" class="t b">查看建议 / 修改结果</text>
<text x="740" y="715" text-anchor="middle" class="t b">形成最终诊疗记录</text>

<rect x="950" y="610" width="190" height="135" rx="24" fill="#e7f0e3"/>
<text x="1045" y="652" text-anchor="middle" class="t m">报表与归档</text>
<text x="1045" y="687" text-anchor="middle" class="t xs">自动报表</text>
<text x="1045" y="715" text-anchor="middle" class="t xs">打印 / 存档</text>

<path class="line" d="M260 535V590"/><polygon class="arrow" points="253,583 267,583 260,596"/>
<path class="line" d="M650 535V590"/><polygon class="arrow" points="643,583 657,583 650,596"/>
<path class="line" d="M530 677H580"/><polygon class="arrow" points="573,670 573,684 586,677"/>
<path class="line" d="M890 677H940"/><polygon class="arrow" points="933,670 933,684 946,677"/>

<!-- AI branch -->
<rect x="40" y="610" width="150" height="135" rx="24" fill="#eee5f7"/>
<text x="115" y="652" text-anchor="middle" class="t m">AI 辅助</text>
<text x="115" y="687" text-anchor="middle" class="t xs">基于结构化检查数据</text>
<text x="115" y="715" text-anchor="middle" class="t xs">输出可控建议</text>
<path class="line" d="M190 677H220"/><polygon class="arrow" points="213,670 213,684 226,677"/>
</svg>